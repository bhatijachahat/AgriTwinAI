services:
  backend:
    build: ./backend
    environment:
      - GROQ_API_KEY
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      - AUTH_SECRET
      - FAST2SMS_KEY
      - DATA_GOV_API_KEY
      - DB_PATH=/app/data/agritwin.db
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
